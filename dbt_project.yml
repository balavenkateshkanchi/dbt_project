# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  entity_columns: "{{ get_cols_from_table() }}"  # Ensure the macro `get_cols_from_table` is defined and returns the correct structure.
  md5_exclude_list: ['BUSINESS_HKEY', 'ALL_HASH_KEY', 'FULL_HASH_KEY', 'BATCH_ID', 'LOAD_DATE','MODIFIED_DATE','BATCH_ID']
  batch_id: "{{ run_started_at.strftime('%Y%m%d%H%M%S') }}"  # This variable captures the timestamp when the dbt run started, formatted as YYYYMMDDHHMMSS.

on-run-start:
  - "{{ log_batch_master(var('batch_id')) }}"
  
# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_project:
    scd_types:
      scd_type_1:
        +pre-hook: "{{ log_batch_details_start(var('batch_id')) }}"
        +post-hook: "{{ log_batch_details_end(var('batch_id'),'SUCCESS') }}"
      scd_type_2:
        +pre-hook: "{{ log_batch_details_start(var('batch_id')) }}"
        +post-hook: "{{ log_batch_details_end(var('batch_id'),'SUCCESS') }}"
      scd_type_4:
        scd_type_4_main_records:
          +pre-hook: 
            - "{{ log_batch_details_start(var('batch_id')) }}"
          +post-hook: "{{ log_batch_details_end(var('batch_id'),'SUCCESS') }}"
        scd_type_4_history:
          +pre-hook: 
            - "{{ log_batch_details_start(var('batch_id')) }}"
          +post-hook: "{{ log_batch_details_end(var('batch_id'),'SUCCESS') }}"